name: Build APK

# Started by the apk-builder worker (smti.uk/apk) through the GitHub API.
# It fetches the job's settings from the worker, builds the Android app and uploads the APK back.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id from the apk-builder worker"
        required: true

run-name: "APK ${{ inputs.job_id }}"

concurrency:
  group: apk-${{ inputs.job_id }}

permissions:
  contents: read

env:
  # Fixed here on purpose (not an input), so the build secret is only ever sent to this address.
  BUILDER_URL: ${{ vars.APK_BUILDER_URL || 'https://smti.uk/apk' }}
  JOB_ID: ${{ inputs.job_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android
            lock
            scripts

      - name: Check job id and secret
        env:
          SECRET: ${{ secrets.APK_BUILD_SECRET }}
        run: |
          [[ "$JOB_ID" =~ ^[a-f0-9]{24}$ ]] || { echo "bad job id"; exit 1; }
          [ -n "$SECRET" ] || { echo "APK_BUILD_SECRET is not set"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch job settings
        env:
          SECRET: ${{ secrets.APK_BUILD_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer $SECRET" "$BUILDER_URL/builder/jobs/$JOB_ID" -o job.json
          # "site" apps are built from android/, the app locker from lock/
          if [ "$(jq -r '.type // "site"' job.json)" = "lock" ]; then PROJ=lock; else PROJ=android; fi
          mv job.json "$PROJ/job.json"
          cd "$PROJ"
          jq '.config' job.json > app/src/main/assets/config.json
          {
            echo "PROJ=$PROJ"
            echo "APP_ID=$(jq -r .appId job.json)"
            echo "VERSION_CODE=$(jq -r .versionCode job.json)"
            echo "VERSION_NAME=$(jq -r .versionName job.json)"
            echo "FIRST_HOST=$(jq -r .firstHost job.json)"
            echo "FIRST_URL=$(jq -r '.firstUrl // ""' job.json)"
          } >> "$GITHUB_ENV"
          jq -r .appName job.json > app_name.txt
          [[ "$(jq -r .appId job.json)" =~ ^[a-z][a-z0-9_.]+$ ]] || { echo "bad app id"; exit 1; }

      - name: App icon
        run: |
          set -e
          cd "$PROJ"
          RES=app/src/main/res
          ICON=""; MODE=""
          if [ -n "$(jq -r '.icon // ""' job.json)" ]; then
            # Uploaded on the site (already a square): fills the whole icon.
            jq -r .icon job.json | base64 -d > icon_src.png
            ICON=icon_src.png; MODE=full; BG="#FFFFFF"
          elif [ -n "$FIRST_URL" ] && python3 -I "$GITHUB_WORKSPACE/scripts/find_icon.py" "$FIRST_URL" icon_site.png; then
            # The site's own icon: centred on white.
            ICON=icon_site.png; MODE=padded; BG="#FFFFFF"
          elif [ "$PROJ" = lock ]; then
            echo "Icon: default lock"; exit 0
          else
            # No icon anywhere: the first letter of the app name on a colour.
            LETTER=$(jq -r '.appName' job.json | python3 -c "import sys; t=sys.stdin.read().strip(); print(t[:1] or 'A')")
            COLORS=("#1F5FAD" "#2E7D32" "#C2410C" "#7C3AED" "#0F766E" "#B91C1C" "#334155")
            BG=${COLORS[$(( $(jq -r '.appName' job.json | cksum | cut -d' ' -f1) % ${#COLORS[@]} ))]}
            FONT=$(fc-match -f '%{file}' 'sans-serif:bold:lang=he' 2>/dev/null || true)
            convert -size 432x432 xc:none ${FONT:+-font "$FONT"} -fill white -pointsize 230 -gravity center \
              -annotate +0+0 "$LETTER" PNG32:icon_letter.png
            ICON=icon_letter.png; MODE=letter
          fi
          echo "Icon: $MODE"
          # Adaptive icon (Android 8+): background colour + foreground image inside the safe zone.
          rm -f $RES/drawable/ic_launcher_fg.xml $RES/mipmap-xxxhdpi/ic_launcher.png
          mkdir -p $RES/drawable-nodpi $RES/mipmap-anydpi-v26 $RES/values
          case $MODE in
            full)   convert "$ICON" -resize 432x432 PNG32:$RES/drawable-nodpi/ic_launcher_fg.png ;;
            padded) convert "$ICON" -resize 264x264 -background none -gravity center -extent 432x432 PNG32:$RES/drawable-nodpi/ic_launcher_fg.png ;;
            letter) cp "$ICON" $RES/drawable-nodpi/ic_launcher_fg.png ;;
          esac
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="custom_icon_bg">%s</color></resources>\n' "$BG" > $RES/values/custom_icon.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/custom_icon_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>\n' > $RES/mipmap-anydpi-v26/ic_launcher.xml
          # Older Android: a rounded square.
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            S=${d##*:}; mkdir -p "$RES/mipmap-${d%%:*}"
            case $MODE in full) INNER=$S ;; padded) INNER=$((S*72/100)) ;; letter) INNER=$S ;; esac
            convert -size ${S}x${S} xc:none -fill "$BG" -draw "roundrectangle 0,0 $((S-1)),$((S-1)) $((S/5)),$((S/5))" \
              \( "$ICON" -resize ${INNER}x${INNER} \) -gravity center -composite \
              \( -size ${S}x${S} xc:none -fill white -draw "roundrectangle 0,0 $((S-1)),$((S-1)) $((S/5)),$((S/5))" \) \
              -compose DstIn -composite PNG32:"$RES/mipmap-${d%%:*}/ic_launcher.png"
          done

      - name: Tell the site we are building
        env:
          SECRET: ${{ secrets.APK_BUILD_SECRET }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $SECRET" -H "content-type: application/json" \
            -d '{"status":"building"}' "$BUILDER_URL/builder/jobs/$JOB_ID/status" || true

      - name: Signing key
        env:
          SECRET: ${{ secrets.APK_BUILD_SECRET }}
          KS_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Using the key from GitHub secrets"
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
          else
            # One shared key kept by the worker, so new builds install as updates.
            curl -fsS -H "Authorization: Bearer $SECRET" "$BUILDER_URL/builder/keystore" -o ks.json
            if [ "$(jq -r '.none // false' ks.json)" = "true" ]; then
              echo "Creating a new signing key"
              PASS=$(openssl rand -hex 16)
              keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias smt -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=SMT Apps" >/dev/null 2>&1
              jq -n --arg k "$(base64 -w0 "$KS")" --arg p "$PASS" '{keystore:$k,password:$p}' > ks_new.json
              curl -fsS -X PUT -H "Authorization: Bearer $SECRET" -H "content-type: application/json" \
                --data @ks_new.json "$BUILDER_URL/builder/keystore" -o ks.json
              rm -f ks_new.json "$KS"
            fi
            jq -r .keystore ks.json | base64 -d > "$KS"
            PASS=$(jq -r .password ks.json)
            rm -f ks.json
          fi
          echo "::add-mask::$PASS"
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappId="$APP_ID" -PappName="$(cat app_name.txt)" \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          ls -la app/build/outputs/apk/release/

      - name: Upload the APK to the site
        env:
          SECRET: ${{ secrets.APK_BUILD_SECRET }}
        run: |
          curl -fsS -X PUT -H "Authorization: Bearer $SECRET" -H "content-type: application/vnd.android.package-archive" \
            --data-binary @"$PROJ/app/build/outputs/apk/release/app-release.apk" "$BUILDER_URL/builder/jobs/$JOB_ID/apk"

      - name: Report failure
        if: failure()
        env:
          SECRET: ${{ secrets.APK_BUILD_SECRET }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $SECRET" -H "content-type: application/json" \
            -d '{"status":"error","error":"הבנייה נכשלה. נסה שוב, ואם זה חוזר פנה למנהל האתר."}' \
            "$BUILDER_URL/builder/jobs/$JOB_ID/status" || true
